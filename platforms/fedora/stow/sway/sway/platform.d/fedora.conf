# The shared config already loads /etc/sway/config.d/* (sway-systemd).
# Keep Fedora's session helpers, but not its bar, idle daemon or keybindings.
include /usr/share/sway/config.d/50-rules-policykit-agent.conf
include /usr/share/sway/config.d/95-autostart-policykit-agent.conf
include /usr/share/sway/config.d/95-xdg-desktop-autostart.conf

# Use Fedora's native Wayland launcher instead of the terminal-based launcher.
unbindsym $mod+space
bindsym $mod+space exec fuzzel

# Fedora keeps apparatus alongside the other github.com/liouk repositories.
unbindsym $mod+comma
bindsym $mod+comma exec swaymsg '[app_id="dev.zed.Zed" title="apparatus"]' focus || zeditor ~/liouk/apparatus
